strategy_id: kospi_large_pullback_volume_v1
version: '0.1'
description: 코스피 대형주 15종목 일봉에 쓰는 초안 규칙입니다. 120일 추세가 상승 중인 종목만 봅니다. 20일 이동평균 근처까지 짧게
  눌린 뒤 거래량이 늘면서 전일 고가를 넘어 회복하는 봉이 나오면 진입 조건이 충족됩니다. 청산은 두 가지입니다. 종가가 2일 연속 120일선 아래에
  있거나, 직전 10일 저가에서 0.5 ATR을 뺀 값 아래로 내려가면 청산합니다. 비중은 역변동성으로 정하고 한 종목당 10%가 상한입니다. 고변동성
  레짐이라 20일 일간 변동성이 4.5%를 넘는 종목은 신규 진입에서 뺍니다. 이 문서는 백테스트용 draft 레시피이며 매매 지시가 아닙니다.
market: KR_STOCK
timeframe: daily
universe_filter:
  min_avg_daily_value: 10000000000
  max_universe_size: 15
features:
- name: sma20
  formula: sma(close, 20)
  lookback_days: 20
  source_citation: moskowitz_ooi_pedersen_2012 [미검증]
- name: sma120
  formula: sma(close, 120)
  lookback_days: 120
  source_citation: faber_2007_ssrn [미검증]; moskowitz_ooi_pedersen_2012 [미검증]
- name: trend_up
  formula: close > sma120 and sma20 > sma120 and sma120 > lag(sma120, 20)
  lookback_days: 140
  source_citation: moskowitz_ooi_pedersen_2012 [미검증]; aqr_century_trend_2017 [미검증]
- name: pullback_touch
  formula: lag(lowest(low / sma20, 3), 1) <= 1.01 and lag(lowest(close / sma20, 3),
    1) >= 0.97
  lookback_days: 24
  source_citation: design assumption (단기 되돌림 정의) — jegadeesh_titman_1993 [미검증]의 단기
    반전 효과와 대조 필요
- name: recovery_bar
  formula: close > sma20 and close > lag(high, 1) and close > open
  lookback_days: 21
  source_citation: design assumption (회복 확인 봉)
- name: vol_ratio
  formula: volume / sma(volume, 20)
  lookback_days: 20
  source_citation: lee_swaminathan_2000 [미검증]
- name: volume_confirm
  formula: vol_ratio >= 1.3
  lookback_days: 20
  source_citation: lee_swaminathan_2000 [미검증] (가설에 반하는 방향 포함)
- name: vol20
  formula: stdev(ret(close, 1), 20)
  lookback_days: 21
  source_citation: barroso_santa_clara_2015 [미검증]
- name: vol_ok
  formula: vol20 <= 0.045
  lookback_days: 21
  source_citation: barroso_santa_clara_2015 [미검증]; daniel_moskowitz_2016 [미검증]
- name: entry_signal
  formula: trend_up and pullback_touch and recovery_bar and volume_confirm and vol_ok
  lookback_days: 140
  source_citation: composite of above
- name: trend_break
  formula: close < sma120 and lag(close, 1) < lag(sma120, 1)
  lookback_days: 121
  source_citation: faber_2007_ssrn [미검증]
- name: swing_break
  formula: close < lag(lowest(low, 10), 1) - 0.5 * atr(14)
  lookback_days: 15
  source_citation: design assumption (ATR 기반 구조 이탈) — risk-matrix-designer 2×ATR 기준과
    정합
entry_rules:
- entry_signal is true
exit_rules:
- trend_break or swing_break
no_chasing_rules:
  max_premium_over_reference: 0.005
  max_reproposals_per_day: 1
position_sizing:
  method: inverse_volatility
  max_target_weight: 0.1
risk_rules:
- 단일 종목 목표 비중은 10%를 넘지 않는다(max_target_weight 0.10).
- 같은 섹터 합산 비중은 25%를 넘지 않는다. 금융·반도체·배터리 군집이 동시에 신호를 내면 섹터 상한이 우선한다.
- 보유 종목 간 60일 쌍상관이 0.6을 넘는 종목은 추가 편입 대상에서 뺀다(correlation_budget).
- 레버리지 1.0배를 넘지 않는다. 신호가 적으면 현금 비중을 높게 두는 것을 허용한다.
- 포트폴리오 낙폭이 10%에 도달하면 신규 진입을 중단한다. 20%에 도달하면 전 포지션을 청산 대상으로 표시하고 운용을 검토한다.
- 종가 기준 진입가 대비 손실이 8%를 넘으면 청산 대상으로 표시한다. 엔진은 다음 봉 시가에 체결하므로 갭 손실은 이 값을 넘을 수 있다.
- 브레드스(120일선 위 종목 비율)는 GRAMMAR로 계산할 수 없다. 그래서 백테스트 리포트에서 브레드스 30% 미만 구간의 성과를 따로 집계하는
  점검 항목으로만 둔다.
- 이 레시피는 draft 연구 산출물이다. 거래 입력이나 승격 근거로 쓰지 않는다.
rebalance: daily
execution_permissions:
  allowed_order_types:
  - limit
  market_orders: disabled
validation:
  walk_forward:
    train_size: 180
    test_size: 40
    purge_bars: 140
    embargo_bars: 10
promotion_status: draft
allowed_execution_levels: []
audit_metadata:
  authored_by: qp-design-strategy-designer
  authored_at: '2026-09-14'
  hypothesis: 코스피 대형주에서 120일 추세 위 20일 눌림목을 거래량 확인으로 매수하고 추세 이탈에 청산
  design_notes: '[반영 1: 고변동성 레짐] 표본의 20일 연율 변동성은 59.6이고 1년 백분위는 92였습니다. 모멘텀 손실 꼬리는
    변동성을 조절하면 줄어든다는 연구가 있습니다(Barroso·Santa-Clara 2015). 이를 두 가지로 반영했습니다. (a) position_sizing을
    inverse_volatility로 두고 상한을 0.10으로 정했습니다. (b) 종목별 20일 일간 수익률 표준편차가 0.045(연율 약 71%)를
    넘으면 진입하지 않는 vol_ok 필터를 넣었습니다. 분석 표의 20일 변동성으로 보면 SK하이닉스(126.7)와 배터리 3종목(93~100)은
    현재 진입 대상에서 빠집니다. 이 필터 때문에 표본 거래 수가 크게 줄 수 있어, 포렌식 단계에서 필터를 켠 버전과 끈 버전을 비교해야 합니다.

    [반영 2: 장·단기 방향 불일치] 분석가는 120일 수익이 강한데 SMA20 아래로 내려온 종목(SK하이닉스·삼성전자·현대차)을 짚었습니다.
    이 레시피는 그런 종목을 바로 사지 않습니다. 20일선 부근 저가 터치(pullback_touch), 20일선 위 회복 봉, 거래량 확인이
    모두 나와야 진입합니다. 여기에 sma20 > sma120과 120일선의 20일 기울기 양수를 요구해, 급등 뒤 추세가 꺾이는 경우를 거릅니다.
    현대차처럼 세 이동평균선 아래로 모두 내려간 종목은 trend_up에서 걸러집니다.

    [반영 3: 브레드스 약세] 120일 브레드스가 26.7%(4/15)라 조건을 충족하는 종목이 적습니다. 이 점을 위험 규칙에 반영했습니다.
    동시 보유 종목 수에 상한을 두고, 신호 수가 적으면 현금 비중이 높아지는 것을 허용합니다. 다만 GRAMMAR는 종목별 시계열 식만 지원하고
    횡단면 브레드스를 계산할 식이 없습니다. 그래서 ''브레드스 < 30%이면 진입 중단'' 같은 규칙은 쓸 수 없었습니다. 이 한계는 risk_rules에
    운영 점검 항목으로만 남겼습니다.

    [반영 4: 상관] 평균 쌍상관은 0.44로 normal이지만 최대값이 0.85입니다. 그래서 correlation_budget을 0.6으로
    정하고, 섹터 상한을 25%로 두었습니다(종목 상한 10% 기준 한 섹터에 최대 2종목 반). 금융 2종목과 반도체 2종목이 동시에 들어오면
    섹터 상한에 걸리게 됩니다.

    [미반영] 수급(flows 빈 배열)과 섹터 모멘텀(빈 배열)은 데이터가 없어 반영하지 않았습니다. 52주 고점 근접 가설(분석가 함의 3)은
    사용자 가설과 다른 신호라 이번 레시피에 섞지 않았습니다.

    [엔진 한계] 일봉 기준이고 다음 봉 시가 지정가로 체결한다고 가정합니다. 가격제한폭, VI, 호가단위는 모델링되지 않습니다. 그래서 규칙은
    모두 종가 기준으로 확정되는 조건만 씁니다. 장중 손절이나 공매도는 쓰지 않았습니다. risk_matrix.stop_loss_pct(8%)는
    종가 기준 점검값이며, 갭 하락이 나면 실제 손실은 이보다 커질 수 있습니다.

    [문법 해석] entry_rules와 exit_rules가 AND로 결합되는지 OR로 결합되는지 모호합니다. 그래서 각각 규칙 1개로 만들고
    복합 불리언 피처(entry_signal, trend_break or swing_break)로 조건을 명시했습니다.

    [검증 한계] 최대 룩백은 140봉(sma120 + 기울기용 lag 20)입니다. 2년 약 490봉에서 walk-forward fold는 3~4개에
    그칩니다. 사이클이 2개 미만일 수 있으니, 결과는 전반·후반 부호 일관성으로만 해석해야 합니다.

    [출처] 이번 설계에서는 WebSearch로 출처를 대조하지 않았습니다. 따라서 sources는 모두 verified=false([미검증])입니다.
    DOI와 SSRN 번호는 기억에 의존했으므로 인용 전에 확인해야 합니다.'
  sources:
  - id: jegadeesh_titman_1993
    type: peer_reviewed
    title: 'Returns to Buying Winners and Selling Losers: Implications for Stock Market
      Efficiency (Journal of Finance)'
    year: 1993
    url_or_doi: 10.1111/j.1540-6261.1993.tb04702.x [미검증]
    key_claim: 3~12개월 과거 승자 종목은 이후 3~12개월 동안 초과수익을 보입니다. 반면 1개월 수준의 단기 수익은 반전하는 경향이
      있습니다. 중기 추세를 조건으로 두고 단기 되돌림에 진입하는 설계의 이론적 배경입니다. 다만 대상은 미국 주식이고 대형주 15종목 시계열
      규칙을 직접 검증한 연구는 아닙니다.
    grade: B
    verified: false
    challenges_hypothesis: false
  - id: moskowitz_ooi_pedersen_2012
    type: peer_reviewed
    title: Time Series Momentum (Journal of Financial Economics)
    year: 2012
    url_or_doi: 10.1016/j.jfineco.2011.11.003 [미검증]
    key_claim: 선물·지수 자산에서 자기 과거 12개월 수익률의 부호가 이후 수익을 예측합니다. 추세 필터(120일선 위)의 근거로 쓰였습니다.
      다만 대상이 개별 주식이 아니라 자산군 선물입니다.
    grade: B
    verified: false
    challenges_hypothesis: false
  - id: barroso_santa_clara_2015
    type: peer_reviewed
    title: Momentum Has Its Moments (Journal of Financial Economics)
    year: 2015
    url_or_doi: 10.1016/j.jfineco.2014.11.010 [미검증]
    key_claim: 모멘텀 위험의 상당 부분은 예측 가능한 모멘텀 고유 변동성입니다. 실현 변동성으로 노출을 조정하면 크래시와 첨도가 크게
      줄어듭니다. 역변동성 사이징과 vol_ok 필터의 근거입니다. 볼트 노트 [[Barroso·Santa-Clara 2015 — 모멘텀에도
      모멘트가 있다]]에도 있습니다.
    grade: B
    verified: false
    challenges_hypothesis: false
  - id: daniel_moskowitz_2016
    type: peer_reviewed
    title: Momentum Crashes (Journal of Financial Economics)
    year: 2016
    url_or_doi: 10.1016/j.jfineco.2015.12.002 [미검증]
    key_claim: 모멘텀 전략은 고변동성·하락장 이후 반등 국면에서 크게 폭락합니다. 현재 표본은 변동성 백분위 92이고 브레드스가 약합니다.
      이런 구간에서는 추세 추종 진입의 손실 꼬리가 커질 수 있어 가설에 반하는 증거입니다.
    grade: B
    verified: false
    challenges_hypothesis: true
  - id: lee_swaminathan_2000
    type: peer_reviewed
    title: Price Momentum and Trading Volume (Journal of Finance)
    year: 2000
    url_or_doi: 10.1111/0022-1082.00280 [미검증]
    key_claim: 과거 거래량이 많았던 승자 종목은 모멘텀이 더 빨리 소진되고 장기적으로 반전하는 경향이 있습니다. '거래량 증가 = 확인'이라는
      가정과 충돌할 수 있습니다. volume_confirm 임계값은 반드시 on/off 비교로 검증해야 합니다.
    grade: B
    verified: false
    challenges_hypothesis: true
  - id: faber_2007_ssrn
    type: working_paper
    title: A Quantitative Approach to Tactical Asset Allocation (SSRN)
    year: 2007
    url_or_doi: SSRN abstract 962461 [미검증]
    key_claim: 10개월 이동평균 위에서만 보유하는 단순 추세 규칙은 수익을 크게 해치지 않으면서 낙폭을 줄였습니다. 이동평균 이탈 청산
      규칙의 근거입니다. 대상이 자산군 지수라 개별 대형주로 옮겨 적용하는 것은 가정입니다.
    grade: B
    verified: false
    challenges_hypothesis: false
  - id: aqr_century_trend_2017
    type: practitioner
    title: A Century of Evidence on Trend-Following Investing (AQR, Hurst·Ooi·Pedersen)
    year: 2017
    url_or_doi: AQR white paper (URL 미확인) [미검증]
    key_claim: 추세 추종 수익은 여러 자산과 긴 기간에 걸쳐 관찰됩니다. 다만 추세 전환 구간에서는 휩소 손실이 반복됩니다. 청산에 2일
      연속 조건을 둔 근거입니다. 실무 자료라 표본 선택과 비용 가정은 AQR 기준입니다.
    grade: B
    verified: false
    challenges_hypothesis: false
  risk_matrix:
    sizing_formula: vol_targeting
    max_position_pct: 10
    max_sector_pct: 25
    max_portfolio_drawdown_pct: 20
    stop_loss_pct: 8
    correlation_budget: 0.6
    leverage_max: 1
    circuit_breakers:
    - trigger: portfolio_drawdown_exceeds_10pct
      action: halt_new_entries
    - trigger: portfolio_drawdown_exceeds_20pct
      action: flag_all_positions_for_exit_and_pause_strategy_review
    - trigger: position_close_loss_exceeds_stop_loss_pct
      action: close_position_next_bar
    - trigger: universe_realized_vol_percentile_above_95
      action: halve_target_weights_for_new_entries
    sources:
    - barroso_santa_clara_2015 [미검증] — 변동성 조정 사이징
    - daniel_moskowitz_2016 [미검증] — 고변동성 구간 크래시 위험
    - risk-matrix-designer skill 기본값 표(stop 2×ATR, DD ≥ 2×position)
  reviewed_by: qp-design-backtest-forensics, qp-design-risk-gate (research only)
status: draft

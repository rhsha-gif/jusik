[project]
name = "quantpilot-pre-harness"
version = "0.1.0"
description = "Safe fixture-only QuantPilot Operator pre-harness."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "pyyaml",
  "uvicorn",
]

[project.optional-dependencies]
paper = [
  "websockets==15.0.1",
  "exchange-calendars==4.13.2",
  "fastapi==0.133.1",
  "starlette==1.0.1",
]
test = [
  "httpx",
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["quantpilot/tests"]
addopts = "-q"
